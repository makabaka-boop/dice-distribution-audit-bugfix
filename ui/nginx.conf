server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exact probabilities come from the Flask odds service.
    location /api/ {
        proxy_pass http://odds:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://odds:5000/health;
    }

    # Static SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
